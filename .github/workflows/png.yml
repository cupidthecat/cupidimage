name: PNG regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  png:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cflags: -O2 -Wall -Wextra -std=c99
          - name: Clang sanitizers
            cc: clang
            cflags: -O1 -g -Wall -Wextra -std=c99 -fsanitize=address,undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4
      - name: Build library and CLI and run PNG regressions
        run: make -j2 all test-png CC="${{ matrix.cc }}" CFLAGS="${{ matrix.cflags }}"

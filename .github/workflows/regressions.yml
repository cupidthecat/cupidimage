name: Build and regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      CFLAGS: -O1 -g -Wall -Wextra -std=c99 -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer -fno-pie -no-pie
    steps:
      - uses: actions/checkout@v4
      - run: make -j2 all test
      - run: make test-pdf-corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-results-${{ matrix.compiler }}
          path: .cache/asset-tests/results.jsonl
          if-no-files-found: warn

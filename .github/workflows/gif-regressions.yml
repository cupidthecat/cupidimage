name: GIF regressions

on: [push, pull_request]

jobs:
  gif:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cc: gcc
            flags: -O2 -g -Wall -Wextra -std=c99
          - cc: clang
            flags: -O1 -g -Wall -Wextra -std=c99 -fsanitize=address,undefined -fno-sanitize-recover=all
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - run: make -j2
      - run: make test-gif-regressions
